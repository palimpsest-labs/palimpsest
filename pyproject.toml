[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palimpsest"
dynamic = ["version"]
description = "Open-source research engine for investigative journalists — persistent memory, unified search, platform APIs, and LLM synthesis"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]
authors = [
    {name = "Palimpsest Contributors"},
]
keywords = ["investigative", "journalism", "research", "knowledge-graph", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
palimpsest = "palimpsest.__main__:main"

[project.urls]
Homepage = "https://github.com/palimpsest-labs/palimpsest"
Repository = "https://github.com/palimpsest-labs/palimpsest"
Issues = "https://github.com/palimpsest-labs/palimpsest/issues"

[tool.hatch.version]
path = "src/palimpsest/__init__.py"
